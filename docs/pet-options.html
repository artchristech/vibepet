<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net — sprite options</title>
<style>
  :root { --bg: #14161f; --card: #1c1f2c; --line: #2c3150; --text: #e8ebf5; --dim: #8a92a8; --mint: #7ef0c1; --desk: #2a2d3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(20,22,31,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0 14px 0 0; }
  .group { display: flex; gap: 4px; align-items: center; }
  .group span { color: var(--dim); margin-right: 4px; }
  button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  button.on { border-color: var(--mint); color: var(--mint); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 20px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #4a5280; }
  .card.picked { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(126,240,193,.2); }
  .stage { height: 250px; display: grid; place-items: center; background: var(--desk); position: relative; }
  .stage.light { background: #e9e6df; }
  .stage.wall { background: radial-gradient(circle at 30% 20%, #4b3c7a, #1b2440 60%, #0f1522); }
  canvas { image-rendering: pixelated; display: block; }
  .res { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--dim); background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 4px; }
  .num { position: absolute; top: 8px; left: 8px; font-weight: 700; color: var(--mint); background: rgba(0,0,0,.35); padding: 1px 7px; border-radius: 4px; }
  .meta { padding: 10px 14px 14px; }
  .meta b { font-size: 14px; }
  .meta p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  #pick { color: var(--mint); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>Net · sprite options</h1>
  <div class="group" id="states"><span>state</span></div>
  <div class="group" id="bgs"><span>desk</span></div>
  <div class="group" id="zooms"><span>zoom</span></div>
  <div id="pick">click a card to pick</div>
</header>
<main id="grid"></main>

<script>
// ===================== tiny pixel engine (Uint32 buffers, scaled with CSS) =====================
const OUT = '#1b1f2e', DARK = '#141726', WHITE = '#ffffff';
const cache = new Map();
function K(h) {
  let c = cache.get(h);
  if (!c) { const n = parseInt(h.slice(1), 16); c = { r: n >> 16 & 255, g: n >> 8 & 255, b: n & 255 }; c.u = ((255 << 24) | (c.b << 16) | (c.g << 8) | c.r) >>> 0; cache.set(h, c); }
  return c;
}
const hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function mix(a, b, t) { const A = K(a), B = K(b); return hex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t); }
function hsl(h, s, l) { s /= 100; l /= 100; const f = n => { const k = (n + h / 30) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return hex(f(0) * 255, f(8) * 255, f(4) * 255); }
const rampOf = h => [mix(h, '#000000', .55), mix(h, '#000000', .3), h, mix(h, '#ffffff', .35), mix(h, '#ffffff', .75)];

function put(S, x, y, h) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= S.w || y >= S.h) return; S.buf[y * S.w + x] = K(h).u; }
function putA(S, x, y, h, a) {
  x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= S.w || y >= S.h || a <= 0) return;
  const i = y * S.w + x, c = K(h), e = S.buf[i], ea = (e >>> 24) / 255;
  if (ea === 0) { S.buf[i] = ((Math.round(a * 255) << 24) | (c.b << 16) | (c.g << 8) | c.r) >>> 0; return; }
  const er = e & 255, eg = e >> 8 & 255, eb = e >> 16 & 255, na = Math.min(1, ea + a * (1 - ea));
  S.buf[i] = ((Math.round(na * 255) << 24) | (Math.round(eb + (c.b - eb) * a) << 16) | (Math.round(eg + (c.g - eg) * a) << 8) | Math.round(er + (c.r - er) * a)) >>> 0;
}
function rectF(S, x, y, w, h, c) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < Math.max(1, Math.round(h)); j++) for (let i = 0; i < Math.max(1, Math.round(w)); i++) put(S, x + i, y + j, c); }
function ellF(S, cx, cy, rx, ry, c) {
  for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) put(S, x, y, c);
  }
}
function halo(S, cx, cy, R, h, a) {
  for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
    const d = Math.hypot(x + .5 - cx, y + .5 - cy) / R; if (d < 1) putA(S, x, y, h, a * (1 - d) * (1 - d));
  }
}
function shadow(S, cx, cy, rx, ry) { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) putA(S, x, y, '#000000', .22); } }

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]].map(r => r.map(v => (v + .5) / 16));
// clean bands; ordered dither only in a narrow seam between tones
const dith = (t, x, y, n) => { const f = Math.max(0, Math.min(.999, t)) * (n - 1); let i = Math.floor(f); const fr = f - i; if (fr > .62 || (fr > .38 && (fr - .38) / .24 > BAYER[y & 3][x & 3])) i++; return Math.min(i, n - 1); };

// generic filled shape with a 1px outline wherever an outside pixel touches the inside
function fillShape(S, x0, y0, W, H, test, color, outline) {
  x0 = Math.floor(x0); y0 = Math.floor(y0); W = Math.ceil(W); H = Math.ceil(H);
  const m = new Uint8Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) m[j * W + i] = test(x0 + i, y0 + j) ? 1 : 0;
  const ins = (i, j) => i >= 0 && j >= 0 && i < W && j < H && m[j * W + i];
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const x = x0 + i, y = y0 + j;
    if (m[j * W + i]) put(S, x, y, color(x, y));
    else if (outline && (ins(i - 1, j) || ins(i + 1, j) || ins(i, j - 1) || ins(i, j + 1))) put(S, x, y, typeof outline === 'function' ? outline(x, y) : outline);
  }
}
// lit sphere-ish blob. shape(dx,dy,x,y) -> r (inside when <= 1)
function orb(S, cx, cy, rx, ry, ramp, o = {}) {
  const shape = o.shape || ((dx, dy) => dx * dx + dy * dy);
  const R = (x, y) => shape((x + .5 - cx) / rx, (y + .5 - cy) / ry, x, y);
  const ext = o.ext || 1;
  fillShape(S, cx - rx - 3, cy - ry - 3, rx * 2 + 7, ry * (1 + ext) + 7, (x, y) => R(x, y) <= 1, (x, y) => {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry, r = Math.min(1, Math.max(0, o.rOf ? o.rOf(dx, dy) : R(x, y)));
    if (o.flat) { if (dy > .5 || (dx > .65 && dy > .05)) return ramp[1]; if ((dx + .45) ** 2 + (dy + .5) ** 2 < .05) return ramp[4]; return ramp[2]; }
    if (o.spec !== false && (dx + .4) ** 2 + (dy + .5) ** 2 < (o.specR ?? .012)) return WHITE;
    if (o.rim && r > .72 && dx > .15 && dy > .1) return o.rim;
    if (o.spec2 && (dx + .4) ** 2 + (dy + .5) ** 2 < (o.specR ?? .012) * 3.5) return ramp[ramp.length - 1];
    const nz = Math.sqrt(1 - r), d = -.45 * dx - .6 * dy + .66 * nz - (o.ao ? Math.max(0, dy - .45) * o.ao : 0) + (o.tex ? o.tex(x, y) : 0);
    return ramp[dith((d + .3) / 1.2, x, y, ramp.length)];
  }, o.outline === undefined ? OUT : o.outline);
}
function rrect(S, x, y, w, h, rad, colorFn, outline) {
  const inside = (px, py) => {
    const lx = px + .5 - x, ly = py + .5 - y; if (lx < 0 || ly < 0 || lx > w || ly > h) return false;
    const cx = Math.min(Math.max(lx, rad), w - rad), cy = Math.min(Math.max(ly, rad), h - rad);
    return (lx - cx) ** 2 + (ly - cy) ** 2 <= rad * rad;
  };
  fillShape(S, x - 2, y - 2, w + 5, h + 5, inside, colorFn, outline);
}
function tri(S, a, b, c, colorFn, outline) {
  const sgn = (p, q, r) => (p[0] - r[0]) * (q[1] - r[1]) - (q[0] - r[0]) * (p[1] - r[1]);
  const xs = [a[0], b[0], c[0]], ys = [a[1], b[1], c[1]];
  fillShape(S, Math.min(...xs) - 2, Math.min(...ys) - 2, Math.max(...xs) - Math.min(...xs) + 5, Math.max(...ys) - Math.min(...ys) + 5, (x, y) => {
    const p = [x + .5, y + .5], d1 = sgn(p, a, b), d2 = sgn(p, b, c), d3 = sgn(p, c, a);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
  }, colorFn, outline);
}
function line(S, x0, y0, x1, y1, c, th = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) rectF(S, x0 + (x1 - x0) * i / n - (th - 1) / 2, y0 + (y1 - y0) * i / n - (th - 1) / 2, th, th, c);
}

const GL = {
  bang: ['##', '##', '##', '##', '  ', '##'],
  q: [' ## ', '#  #', '   #', '  # ', ' #  ', '    ', ' #  '],
  z: ['####', '  # ', ' #  ', '####'],
  heart: [' # # ', '#####', '#####', ' ### ', '  #  '],
  note: ['  ##', ' # #', ' #  ', '##  ', '##  '],
  drop: [' # ', '###', '###', ' # '],
};
function glyph(S, x, y, name, c, g = 1, outline = OUT) {
  const pts = []; GL[name].forEach((r, j) => [...r].forEach((ch, i) => ch === '#' && pts.push([i, j])));
  const set = new Set(pts.map(p => p + ''));
  if (outline) for (const [i, j] of pts) for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (!set.has([i + di, j + dj] + '')) rectF(S, x + (i + di) * g, y + (j + dj) * g, g, g, outline);
  for (const [i, j] of pts) rectF(S, x + i * g, y + j * g, g, g, c);
}

// ===================== shared behaviour =====================
function motion(st, t, k) {
  const m = { dy: 0, sq: 0, jx: 0 };
  const hop = (speed, height) => {
    const p = (t * speed) % 1, s = Math.sin(p * Math.PI);
    m.dy = -Math.round(Math.max(0, s) * height * k);
    if (p < .1 || p > .93) m.sq = Math.round(k); else if (s > .5) m.sq = -Math.round(k);
  };
  if (st === 'alert') hop(1.3, 6);
  else if (st === 'celebrate') hop(2.2, 9);
  else if (st === 'sleep') m.sq = Math.sin(t * 1.3) > 0 ? 0 : Math.round(k);
  else if (st === 'working') m.dy = Math.round(Math.sin(t * 7) * .5 * k);
  else if (st === 'nervous') { m.jx = Math.sin(t * 31) > .7 ? Math.max(1, Math.round(k * .7)) : 0; m.dy = Math.round(Math.sin(t * 2.2) * .7 * k); }
  else m.dy = Math.round(Math.sin(t * 2.2) * .8 * k);
  return m;
}
function status(st, t) {
  if (st === 'working') return { h: mix('#2fcf7f', '#c4ffe0', (Math.sin(t * 5) + 1) / 2), glow: true };
  if (st === 'alert') return Math.floor(t * 3) % 2 ? { h: '#ffcf3f', glow: true } : { h: '#8a6a12', glow: false };
  if (st === 'nervous') return { h: '#ff8a5c', glow: true };
  if (st === 'celebrate') return { h: hsl((t * 360) % 360, 90, 65), glow: true };
  if (st === 'sleep') return { h: '#3d4360', glow: false };
  return { h: '#6b7394', glow: false };
}
function eye(S, x, y, k, st, look, o = {}) {
  const th = Math.max(1, Math.round(k * .6));
  const arc = (hw, h, dir) => { for (let i = -hw; i <= hw; i += 1) rectF(S, x + i, y + dir * (1 - (i / hw) ** 2) * h, th, th, DARK); };
  if (st === 'sleep') { arc(1.6 * k, .7 * k, 1); return; }
  if (st === 'celebrate') { arc(1.6 * k, 1.1 * k, -1); return; }
  if (look.blink) { rectF(S, x - 1.4 * k, y + .3 * k, 2.8 * k, th, DARK); return; }
  const big = st === 'alert', rx = (big ? 1.7 : 1.3) * k * (o.eyeScale || 1), ry = (big ? 2.1 : 1.8) * k * (o.eyeScale || 1);
  ellF(S, x, y, rx, ry, DARK);
  if (k >= 1.8 && !o.flat) ellF(S, x, y + ry * .45, rx * .7, ry * .45, o.iris || '#2d4a7a');
  if (o.slit && k >= 1.8) { ellF(S, x, y, rx * .75, ry * .9, o.iris); rectF(S, x - .5, y - ry * .8, 1, ry * 1.6, DARK); }
  const hs = Math.max(1, Math.round(k * .75));
  rectF(S, x - rx * .55, y - ry * .6, hs, hs, WHITE);
  if (k >= 1.8) rectF(S, x + rx * .3, y + ry * .35, Math.max(1, hs - 1), Math.max(1, hs - 1), WHITE);
  if (st === 'nervous') { const s = o.side || 1; line(S, x - 1.6 * k, y - 2.7 * k + s * .5 * k, x + 1.6 * k, y - 2.7 * k - s * .5 * k, DARK, th); }
}
function mouth(S, x, y, k, st, t) {
  const th = Math.max(1, Math.round(k * .5));
  if (st === 'alert' || st === 'celebrate') {
    const r = (st === 'celebrate' ? 1.6 : 1.1) * k;
    ellF(S, x, y + .7 * k, r, r * .9, DARK);
    if (k >= 1.3) ellF(S, x, y + .7 * k + r * .45, r * .6, r * .38, '#ff7ab0');
    return;
  }
  if (st === 'nervous') { const step = Math.max(1, Math.round(k)); for (let i = -2 * k; i <= 2 * k; i++) rectF(S, x + i, y + .6 * k + (Math.floor((i + 20 * k) / step) % 2) * step * .7, 1, th, DARK); return; }
  if (st === 'sleep') { ellF(S, x, y + .9 * k, Math.max(.6, .45 * k), Math.max(.8, .6 * k), DARK); return; }
  for (let i = -1.6 * k; i <= 1.6 * k; i += 1) rectF(S, x + i, y + (1 - (i / (1.6 * k)) ** 2) * .9 * k, 1, th, DARK);
}
function blush(S, x, y, k, o = {}) {
  const rx = 2.2 * k, ry = Math.max(1, .9 * k);
  for (let yy = Math.floor(y - ry); yy <= y + ry; yy++) for (let xx = Math.floor(x - rx); xx <= x + rx; xx++) {
    const dx = (xx + .5 - x) / rx, dy = (yy + .5 - y) / ry;
    if (dx * dx + dy * dy <= 1 && (k < 1.8 || (xx + yy) % 2 === 0 || dx * dx + dy * dy < .35)) put(S, xx, yy, o.c || '#ff9ec4');
  }
}
function antenna(S, x, top, k, st, t, outline, flat) {
  const len = 4.5 * k, w = Math.max(1, Math.round(k * .5));
  for (let j = 0; j < len; j++) rectF(S, x + (flat ? 0 : Math.round(Math.sin(j * .9 + t * 3) * .45 * k * (j / len))), top - j - 1, w, 1, outline);
  const s = status(st, t), bx = x + .3 * k, by = top - len - 1.2 * k;
  if (s.glow) halo(S, bx, by, 4 * k, s.h, .4);
  orb(S, bx, by, 1.5 * k, 1.5 * k, rampOf(s.h), { outline, flat, specR: .06 });
}
function laptop(S, cx, cy, k, t, body, outline) {
  const x = cx - 8 * k, y = cy + 1 * k, w = 16 * k, h = 9 * k;
  const lid = ['#7d869f', '#a3abc2', '#c9cfdc', '#e6eaf2'];
  rrect(S, x, y, w, h, Math.max(1, k * .8), (px, py) => lid[dith(1 - (py - y) / h, px, py, lid.length)], outline);
  const g = mix('#2fcf7f', '#c4ffe0', (Math.sin(t * 3) + 1) / 2);
  if (k >= 1.8) halo(S, cx, y + h * .45, 3 * k, g, .5);
  ellF(S, cx, y + h * .45, Math.max(1, .9 * k), Math.max(1, .9 * k), g);
  rrect(S, cx - 10 * k, y + h, 20 * k, 2.2 * k, Math.max(1, k * .5), () => '#8a92a8', outline);
  const tk = Math.floor(t * 10) % 2;
  orb(S, cx - 8.5 * k, y + h - k * .4 + tk * k * .6, 1.7 * k, 1.3 * k, body, { outline, spec: false });
  orb(S, cx + 8.5 * k, y + h - k * .4 + (1 - tk) * k * .6, 1.7 * k, 1.3 * k, body, { outline, spec: false });
}
function sweat(S, x, y, k) {
  if (k < 1.5) { glyph(S, x, y, 'drop', '#8fd3ff', 1); return; }
  orb(S, x, y + k, 1.3 * k, 1.8 * k, rampOf('#8fd3ff'), { shape: (dx, dy) => dx * dx / (dy < 0 ? (1 + dy) * (1 + dy) + .001 : 1) + dy * dy, specR: .08 });
}

// ===================== designs =====================
const MINT = ['#2a8a7a', '#43b596', '#6dd8b2', '#9ef0cc', '#d9fff1'];
const MINT_SOFT = ['#2f9180', '#48b99a', '#6fd9b4', '#9ef0cc', '#dcfff3'];
const feetOf = r => [r[0], r[0], r[1], r[1], r[2]];

function drawNet(S, st, t, look, k, o = {}) {
  const m = motion(st, t, k), body = o.ramp || MINT, outl = o.outline || OUT, happy = st === 'celebrate';
  const cx = S.w / 2 + m.jx, cy = 34 * k + m.dy, rx = 13 * k + m.sq, ry = 11 * k - m.sq;
  shadow(S, S.w / 2, 47 * k, Math.max(6 * k, 12 * k + m.dy / 2), 1.6 * k);
  const fw = happy ? Math.round(Math.sin(t * 20) * k * .6) : 0;
  for (const s of [-1, 1]) orb(S, cx + s * 6 * k, cy + ry - .5 * k + (s > 0 ? fw : -fw), 3.4 * k, 2.2 * k, feetOf(body), { outline: outl, spec: false, flat: o.flat });
  if (o.arms && st !== 'working') {
    const ay = happy ? cy - 5 * k + Math.round(Math.sin(t * 14) * k) : st === 'alert' ? cy - 2 * k : cy + 3 * k;
    for (const s of [-1, 1]) orb(S, cx + s * (rx + .2 * k), ay, 2.3 * k, 1.9 * k, body, { outline: outl, spec: false });
  }
  orb(S, cx, cy, rx, ry, body, { outline: outl, flat: o.flat, rim: o.rim, specR: .01 });
  const lx = look.x * k * .9, ly = st === 'working' ? k : look.y * k * .7;
  if (st !== 'sleep' || true) { blush(S, cx - 8.5 * k + lx, cy + .6 * k + ly * .5, k); blush(S, cx + 8.5 * k + lx, cy + .6 * k + ly * .5, k); }
  antenna(S, cx, cy - ry, k, st, t, outl, o.flat);
  eye(S, cx - 5.2 * k + lx, cy - 3 * k + ly, k, st, look, { ...o, side: -1 });
  eye(S, cx + 5.2 * k + lx, cy - 3 * k + ly, k, st, look, { ...o, side: 1 });
  if (st === 'working') laptop(S, cx, cy, k, t, body, outl); else mouth(S, cx + lx, cy + 2.2 * k + ly, k, st, t);
  if (st === 'nervous') sweat(S, cx + rx - 4 * k, cy - ry + 2 * k, k);
  return { cx, top: cy - ry - 7 * k, cy, rx, k };
}

function drawSlime(S, st, t, look) {
  const k = 2, m = motion(st, t, k), cx = S.w / 2 + m.jx, cy = 66 + m.dy * .8, rx = 29 + m.sq * 1.5, ry = 24 - m.sq;
  const ramp = ['#1d6f73', '#2a9c9a', '#45c7b8', '#86ecd6', '#d6fff5'];
  shadow(S, S.w / 2, 92, 30 + m.dy / 3, 3);
  const shape = (dx, dy) => dy > 0 ? dx * dx * (1 - .28 * dy) + dy * dy * 1.9 : dx * dx + dy * dy;
  orb(S, cx, cy, rx, ry, ramp, { shape, specR: 0, rOf: (dx, dy) => dx * dx + dy * dy });
  // translucent core + bubbles
  const s = status(st, t);
  halo(S, cx + 2, cy + 6, 14, s.glow ? s.h : '#bfffee', s.glow ? .55 : .25);
  for (let i = 0; i < 4; i++) {

    const a = c.d.draw(c.S, st, t, look), k = c.d.k, g = Math.max(1, Math.round(k));
    const every = (key, ms) => { if ((c.emit[key] || 0) < now) { c.emit[key] = now + ms; return true; } return false; };
    if (st !== c.last && st === 'celebrate') spawn(c, 'spark', 40, { x: a.cx, y: a.top + 6 * k, sx: 20 * k, vx: 2 * k, up: 1.8 * k, g: .05 * k, c: CONF });
    c.last = st;
    if (st === 'celebrate' && every('conf', 110)) spawn(c, 'spark', 3, { x: a.cx, y: a.top + 4 * k, sx: 24 * k, vx: 1 * k, up: 1.4 * k, g: .04 * k, c: CONF });
    if (st === 'sleep' && every('z', 1400)) spawn(c, 'z', 1, { x: a.cx + a.rx * .7, y: a.top + 6 * k, vx: .2, up: .35 * k, c: '#c7d0ff', gs: g });
    if (st === 'working' && every('note', 2600)) spawn(c, 'note', 1, { x: a.cx - a.rx - 2 * k, y: a.top + 8 * k, vx: .2, up: .4 * k, c: '#7ef0c1', gs: g });
    if (st === 'nervous' && every('drop', 800)) spawn(c, 'drop', 1, { x: a.cx + (Math.random() < .5 ? -1 : 1) * (a.rx + 2 * k), y: a.cy - 4 * k, vx: .2, up: -.2, g: .03 * k, c: '#8fd3ff', gs: g });
    if (st === 'alert' && Math.floor(t * 3) % 3) glyph(c.S, a.cx + a.rx * .55, Math.max(2, a.top - 2 * k), 'bang', '#ffcf3f', g);
    for (let i = c.parts.length - 1; i >= 0; i--) {
      const p = c.parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay;
      if (p.life <= 0 || p.y > c.S.h + 4) { c.parts.splice(i, 1); continue; }
      const col = Array.isArray(p.c) ? (p.c = p.c[Math.floor(Math.random() * p.c.length)]) : p.c;
      if (p.kind === 'spark') rectF(c.S, p.x, p.y, Math.max(1, Math.round(k * .8)), Math.max(1, Math.round(k * .8)), col);
      else glyph(c.S, p.x, p.y, p.kind, col, p.gs);
    }
    c.ctx.putImageData(c.img, 0, 0);
  }
}
requestAnimationFrame(frame);
</script>
